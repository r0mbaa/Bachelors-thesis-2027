# Сборка и все тесты wms при каждом пуше и pull request (§12.6).
# Интеграционные тесты core поднимают PostgreSQL через Testcontainers: Docker на раннере есть.
name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  wms:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wms
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка и тесты
        run: ./gradlew build --console=plain

      - name: Отчёты тестов
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: wms/**/build/reports/tests/
