spring:
  application:
    name: wms-core
  datasource:
    url: ${WMS_DB_URL:jdbc:postgresql://localhost:5432/wms}
    username: ${WMS_DB_USER:wms}
    password: ${WMS_DB_PASSWORD:wms}
  jpa:
    # Сессия Hibernate не живёт дольше транзакции сервиса: ленивые связи в контроллерах запрещены.
    open-in-view: false
    hibernate:
      # Схему ведёт только Flyway; Hibernate лишь сверяет с ней маппинг и падает при расхождении.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # UPDATE при сбросе сессии идут в порядке первичных ключей: две конкурентные аллокации
        # обновляют строки остатка в одном порядке и не блокируют друг друга взаимно.
        order_updates: true
  docker:
    compose:
      # Путь от рабочего каталога bootRun, т.е. от wms/core.
      file: ../docker-compose.dev.yml
      lifecycle-management: start-only
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      # Jackson 3 по умолчанию отвергает пропущенное поле-примитив целиком («тело не разобрано»).
      # Пропущенный флаг должен значить false, а пропущенное обязательное число — дойти до Bean
      # Validation и вернуться ошибкой конкретного поля.
      fail-on-null-for-primitives: false

server:
  port: 8080

wms:
  security:
    # Ключ подписи JWT, Base64 от 32 байт (openssl rand -base64 32). Пусто — случайный ключ на каждый запуск.
    jwt-secret: ${WMS_JWT_SECRET:}
    bootstrap:
      # Пароль первого администратора; создаётся, только если в БД ещё нет пользователей.
      password: ${WMS_ADMIN_PASSWORD:}
  allocation:
    # Срок жизни резерва заказа, ещё не вошедшего в задание (FR-M6-04).
    reservation-ttl: 4h
    expiry-check: PT1M

management:
  endpoints:
    web:
      exposure:
        include: health, info
