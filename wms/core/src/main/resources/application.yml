spring:
  application:
    name: wms-core
  datasource:
    url: ${WMS_DB_URL:jdbc:postgresql://localhost:5432/wms}
    username: ${WMS_DB_USER:wms}
    password: ${WMS_DB_PASSWORD:wms}
  jpa:
    # Сессия Hibernate не живёт дольше транзакции сервиса: ленивые связи в контроллерах запрещены.
    open-in-view: false
    hibernate:
      # Схему ведёт только Flyway; Hibernate лишь сверяет с ней маппинг и падает при расхождении.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  docker:
    compose:
      # Путь от рабочего каталога bootRun, т.е. от wms/core.
      file: ../docker-compose.yml
      lifecycle-management: start-only
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info
