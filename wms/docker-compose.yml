# Окружение разработки. `./gradlew :core:bootRun` поднимает его сам (spring-boot-docker-compose),
# вручную: `docker compose up -d`. Сервисы core, planner и TLS-прокси добавляются сюда же,
# когда появятся их образы (NFR-M-05, NFR-SEC-07).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wms
      POSTGRES_USER: wms
      POSTGRES_PASSWORD: wms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
